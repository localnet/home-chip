name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: biomejs/setup-biome@v2
      - run: biome ci

  type:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: package.json
      - run: npm ci
      - run: npm run --workspaces type

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: package.json
      - run: npm ci
      - run: npm run --workspaces test

  hub:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: package.json
      - run: npm ci
      - run: npm run --workspace=@home-chip/hub build
      - run: npm run --workspace=@home-chip/hub package
      # Installed as a host installs it, globally and outside the repository, where no workspace
      # node_modules can supply what the generated manifest leaves out; the e2e then runs that
      # installed command, its bin link and shebang, not dist/main.js. Under a prefix of its own
      # rather than the runner's, so the same command installs locally without touching the
      # machine's global packages.
      - run: npm install --global --prefix "$RUNNER_TEMP/host" apps/hub/dist/home-chip-hub-*.tgz
      - run: npm run --workspace=@home-chip/hub e2e
        env:
          E2E_HUB_BIN: ${{ runner.temp }}/host/bin/home-chip
