name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: biomejs/setup-biome@v2
      - run: biome ci

  type:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: package.json
      - run: npm ci
      - run: npm run --workspaces type

  test:
    runs-on: ubuntu-latest
    # About ten times what the job takes, as for hub below: the suites run simulated Matter nodes,
    # and a process that never exits would otherwise hold the runner for GitHub's six-hour default.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: package.json
      - run: npm ci
      - run: npm run --workspaces test

  hub:
    runs-on: ubuntu-latest
    # About ten times what the job takes. A process that never exits — the hang
    # matter-js/matter.js#4412 causes, or one nothing here has bounded yet — would otherwise hold
    # the runner for GitHub's six-hour default. check and type get none: they run biome and tsc,
    # which start nothing that can be left running.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: package.json
      - run: npm ci
      - run: npm run --workspace=@home-chip/hub build
      - run: npm run --workspace=@home-chip/hub e2e
